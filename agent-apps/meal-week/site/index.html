<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Meal Week</title>
  <meta name="description" content="A week of meals on one grid and the grocery list it needs.">
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <link rel="preload" href="./vendor/fonts/fraunces-latin-full-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="./vendor/fonts/InterVariable.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="./theme.css">
  <link rel="stylesheet" href="./styles/fonts.css">
  <link rel="stylesheet" href="./styles/base.css">
  <link rel="stylesheet" href="./styles/layout.css">
  <link rel="stylesheet" href="./styles/week.css">
  <link rel="stylesheet" href="./styles/list.css">
  <link rel="stylesheet" href="./styles/print.css">
  <script src="./config.js"></script>
  <script type="module" src="./js/app.js"></script>
</head>
<body class="opening">
  <div class="app" id="app">
    <header class="top">
      <div class="title-block">
        <h1 class="week-name" id="week-name">Meal Week</h1>
        <p class="week-meta" id="week-meta"></p>
        <ul class="legend" id="legend" aria-label="Cuisines this week"></ul>
      </div>
      <div class="picker" aria-label="Week">
        <button class="icon-btn" id="prev-week" type="button" aria-label="Previous week">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 5.5 8 12l6.5 6.5"/></svg>
        </button>
        <span class="picker-range" id="picker-range"></span>
        <button class="icon-btn" id="next-week" type="button" aria-label="Next week">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9.5 5.5 16 12l-6.5 6.5"/></svg>
        </button>
      </div>
      <nav class="tabs" aria-label="Screens">
        <button class="tab" type="button" data-view="week" aria-pressed="true">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="4.5" width="17" height="15" rx="2"/><path d="M3.5 9.5h17M9 9.5v10M15 9.5v10"/></svg>
          <span>Week</span>
        </button>
        <button class="tab tab-list" type="button" data-view="list" aria-pressed="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6.5h11M9 12h11M9 17.5h11"/><circle cx="4.5" cy="6.5" r="1"/><circle cx="4.5" cy="12" r="1"/><circle cx="4.5" cy="17.5" r="1"/></svg>
          <span>List</span>
        </button>
        <button class="tab" type="button" data-view="shop" aria-pressed="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 4.5h2.2l2.2 10.2h10.4l2-7.2H7"/><circle cx="9.5" cy="19" r="1.4"/><circle cx="17" cy="19" r="1.4"/></svg>
          <span>Shop</span>
        </button>
        <button class="tab tab-print" type="button" id="print" aria-label="Print the week and the list">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 9V3.5h10V9M7 17.5H4.5v-8h15v8H17"/><rect x="7" y="14" width="10" height="6.5"/></svg>
          <span>Print</span>
        </button>
      </nav>
    </header>

    <main class="board" id="board" data-view="week">
      <section class="week" id="week" aria-label="Meals this week">
        <div class="days-strip" id="days-strip" role="tablist" aria-label="Days"></div>
        <div class="week-viewport" id="week-viewport"></div>
      </section>
      <aside class="list-panel" id="list-panel" aria-label="Grocery list"></aside>
      <section class="shop" id="shop" aria-label="Shop"></section>
    </main>
  </div>

  <div class="print-only" id="print-pages"></div>

  <dialog class="meal-sheet" id="meal-sheet" aria-labelledby="sheet-name">
    <div class="sheet-body" id="sheet-body"></div>
  </dialog>
</body>
</html>
