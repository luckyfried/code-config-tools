<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Rain Radar</title>
  <meta name="description" content="Live rain radar over your town, looping two hours back and half an hour ahead.">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="preload" href="./fonts/recursive-latin-full-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="./theme.css">
  <link rel="stylesheet" href="./styles/base.css">
  <link rel="stylesheet" href="./styles/layout.css">
  <link rel="stylesheet" href="./styles/parts.css">
  <link rel="modulepreload" href="./vendor/three.core.min.js">
  <link rel="modulepreload" href="./vendor/three.module.min.js">
  <link rel="modulepreload" href="./main.js">
  <script src="./config.js"></script>
  <script type="importmap">
  { "imports": { "three": "./vendor/three.module.min.js" } }
  </script>
</head>
<body>
  <main class="app" id="app">
    <canvas class="scene" id="scene" aria-label="Rain radar map"></canvas>
    <canvas class="scene" id="flat" aria-label="Rain radar map" hidden></canvas>
    <div class="place-pin" id="placePin" aria-hidden="true"><span class="place-pin-name" id="pinName">Portland</span></div>

    <header class="topbar">
      <div class="place">
        <h1 class="place-name" id="placeName">Portland</h1>
        <p class="place-meta"><span class="clock" id="clock">--:--</span><span class="wind-now" id="windNow"></span></p>
        <p class="source-chip" id="sourceChip" hidden>Sample radar</p>
      </div>
      <div class="tools">
        <div class="legend" aria-hidden="true">
          <span class="legend-word">Light</span><span class="legend-ramp"></span><span class="legend-word">Heavy</span>
        </div>
        <button class="icon-button" id="openSettings" type="button" aria-label="Settings" aria-haspopup="dialog">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8" /><circle cx="16" cy="7" r="2" /><circle cx="10" cy="17" r="2" /></svg>
        </button>
      </div>
    </header>

    <p class="notice" id="notice" role="status" hidden></p>

    <section class="dock" aria-label="Rain at your place">
      <div class="banner" aria-live="polite">
        <p class="banner-lead" id="bannerLead">Checking the radar</p>
        <p class="banner-big"><span class="banner-num" id="bannerNum">&nbsp;</span><span class="banner-unit" id="bannerUnit"></span></p>
        <p class="banner-sub" id="bannerSub">&nbsp;</p>
      </div>

      <div class="loop">
        <div class="loop-head">
          <button class="play" id="play" type="button" aria-label="Pause the loop">
            <svg class="icon-pause" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1" /><rect x="14" y="5" width="4" height="14" rx="1" /></svg>
            <svg class="icon-play" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M8 5.5v13l10.5-6.5z" /></svg>
          </button>
          <p class="frame-time"><span class="frame-clock" id="frameClock">--:--</span><span class="frame-rel" id="frameRel"></span></p>
        </div>
        <div class="scrubber" id="scrubber" role="slider" tabindex="0" aria-label="Radar time" aria-valuemin="0" aria-valuemax="15" aria-valuenow="0">
          <div class="track"></div>
          <div class="future" id="future"></div>
          <svg class="spark" id="spark" viewBox="0 0 100 32" preserveAspectRatio="none" aria-hidden="true">
            <path class="spark-area" id="sparkArea" d="" />
            <path class="spark-line" id="sparkLine" d="" />
          </svg>
          <div class="ticks" id="ticks"></div>
          <div class="comet" id="comet"><span class="comet-tail"></span><span class="comet-head"></span></div>
        </div>
        <div class="scale" id="scale"></div>
      </div>

      <div class="strip">
        <p class="strip-title"><span>Rain in the next hour</span><span class="strip-peak" id="stripPeak"></span></p>
        <div class="bars" id="bars"></div>
        <div class="bar-scale"><span>Now</span><span>30 min</span><span>1 h</span></div>
      </div>
    </section>

    <p class="attribution" id="attribution"></p>
  </main>

  <dialog class="sheet" id="settings" aria-labelledby="settingsTitle">
    <form method="dialog" class="sheet-body">
      <header class="sheet-head">
        <h2 id="settingsTitle">Settings</h2>
        <button class="icon-button" value="close" aria-label="Close settings">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" /></svg>
        </button>
      </header>

      <fieldset class="field">
        <legend>Place</legend>
        <p class="field-now" id="placeNow">Portland</p>
        <label class="visually-hidden" for="placeSearch">Search for a town or city</label>
        <input class="search" id="placeSearch" type="search" placeholder="Search for a town or city" autocomplete="off" enterkeyhint="search">
        <ul class="results" id="placeResults"></ul>
        <p class="field-note" id="placeNote" hidden></p>
      </fieldset>

      <fieldset class="field">
        <legend>Map</legend>
        <div class="segmented" data-name="zoom">
          <button type="button" data-value="town">Town</button>
          <button type="button" data-value="region">Region</button>
        </div>
      </fieldset>

      <fieldset class="field">
        <legend>Layers</legend>
        <div class="toggles">
          <button type="button" class="toggle" data-layer="radar" aria-pressed="true">Radar</button>
          <button type="button" class="toggle" data-layer="wind" aria-pressed="true">Wind</button>
          <button type="button" class="toggle" data-layer="clouds" aria-pressed="false">Clouds</button>
        </div>
      </fieldset>

      <fieldset class="field">
        <legend>Loop speed</legend>
        <div class="segmented" data-name="speed">
          <button type="button" data-value="slow">Slow</button>
          <button type="button" data-value="normal">Normal</button>
          <button type="button" data-value="fast">Fast</button>
        </div>
      </fieldset>

      <fieldset class="field">
        <legend>Units</legend>
        <div class="segmented" data-name="units">
          <button type="button" data-value="metric">mm and km/h</button>
          <button type="button" data-value="imperial">in and mph</button>
        </div>
      </fieldset>

      <button class="done" value="close">Done</button>
    </form>
  </dialog>

  <script type="module" src="./main.js"></script>
</body>
</html>
