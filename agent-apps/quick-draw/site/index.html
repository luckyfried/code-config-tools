<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Quick Draw</title>
    <meta name="description" content="A two-thumb quick-draw duel on a western street at sundown. The first to draw wins.">
    <link rel="icon" href="./icon.svg" type="image/svg+xml">
    <link rel="preload" href="./fonts/rye-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="./fonts/bitter-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="./theme.css">
    <link rel="stylesheet" href="./styles/base.css">
    <link rel="stylesheet" href="./styles/hud.css">
    <link rel="stylesheet" href="./styles/title.css">
    <link rel="stylesheet" href="./styles/poster.css">
    <script src="./config.js"></script>
    <script type="importmap">
      {
        "imports": {
          "three": "./vendor/three.module.min.js",
          "three/addons/": "./vendor/addons/"
        }
      }
    </script>
    <script type="module" src="./game/main.js"></script>
  </head>
  <body class="is-loading is-title">
    <canvas class="scene" id="scene" aria-hidden="true"></canvas>

    <div class="stage" id="stage" aria-hidden="true">
      <div class="half half--left">
        <div class="thumb thumb--left">
          <span class="thumb__ring"></span>
          <span class="thumb__name" data-name="0"></span>
          <kbd class="thumb__key">A</kbd>
        </div>
      </div>
      <div class="half half--right">
        <div class="thumb thumb--right">
          <span class="thumb__ring"></span>
          <span class="thumb__name" data-name="1"></span>
          <kbd class="thumb__key">L</kbd>
        </div>
      </div>
    </div>

    <header class="hud" id="hud" inert>
      <div class="hud__plate hud__plate--left">
        <span class="hud__name" data-name="0"></span>
        <span class="holes" data-holes="0"></span>
      </div>
      <div class="hud__round">
        <span class="hud__round-name" id="round-name"></span>
        <span class="hud__round-need" id="round-need"></span>
      </div>
      <div class="hud__plate hud__plate--right">
        <span class="hud__name" data-name="1"></span>
        <span class="holes" data-holes="1"></span>
      </div>
    </header>

    <div class="tools" id="tools">
      <button class="tool" id="sound" type="button" aria-label="Sound" aria-pressed="true">
        <svg class="tool__on" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5h3.2L12 5.5v13l-4.8-4H4z"/><path class="tool__wave" d="M15.5 8.5a5 5 0 0 1 0 7M18 6a8.5 8.5 0 0 1 0 12"/></svg>
        <svg class="tool__off" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5h3.2L12 5.5v13l-4.8-4H4z"/><path class="tool__wave" d="M16 9.5l5 5M21 9.5l-5 5"/></svg>
      </button>
      <button class="tool" id="fullscreen" type="button" aria-label="Full screen" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path class="tool__wave" d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/></svg>
      </button>
    </div>

    <div class="callout" id="callout" aria-live="assertive">
      <span class="callout__word callout__word--steady">Steady</span>
      <span class="callout__word callout__word--draw">Draw!</span>
      <span class="callout__word callout__word--early" id="callout-early">Too early</span>
    </div>

    <div class="demo-chip" id="demo-chip" inert>
      <span>A demo duel. Tap or press Space to play your own.</span>
    </div>

    <section class="title" id="title" aria-labelledby="title-name">
      <div class="title__brand">
        <h1 class="title__name" id="title-name">Quick Draw</h1>
        <p class="title__town" id="title-town"></p>
      </div>

      <div class="title__options">
        <div class="seg" role="radiogroup" aria-label="Mode" id="mode">
          <button type="button" role="radio" aria-checked="true" data-mode="duel">Duel</button>
          <button type="button" role="radio" aria-checked="false" data-mode="solo">Solo</button>
        </div>
        <div class="seg seg--best" role="radiogroup" aria-label="Best of" id="best-of">
          <span class="seg__label" aria-hidden="true">Best of</span>
          <button type="button" role="radio" aria-checked="false" data-best="3">3</button>
          <button type="button" role="radio" aria-checked="true" data-best="5">5</button>
          <button type="button" role="radio" aria-checked="false" data-best="7">7</button>
        </div>
      </div>

      <label class="plate plate--left">
        <span class="plate__hint"><span class="plate__dot"></span><span class="plate__where" data-where="0">Left half</span></span>
        <input class="plate__name" id="name-0" type="text" maxlength="14" autocomplete="off" spellcheck="false" enterkeyhint="go" aria-label="Left player's name">
      </label>
      <label class="plate plate--right">
        <span class="plate__hint"><span class="plate__dot"></span><span class="plate__where" data-where="1">Right half</span></span>
        <input class="plate__name" id="name-1" type="text" maxlength="14" autocomplete="off" spellcheck="false" enterkeyhint="go" aria-label="Right player's name">
        <span class="plate__stranger" id="stranger">Draws at 400 ms, then quicker</span>
      </label>

      <div class="title__go">
        <button class="go" id="go" type="button"><span class="go__label">Face off</span></button>
        <p class="title__hint" id="title-hint"></p>
      </div>
    </section>

    <section class="poster" id="poster" role="dialog" aria-modal="true" aria-labelledby="poster-head" inert>
      <div class="poster__sheet">
        <div class="poster__paper">
          <span class="poster__nail" aria-hidden="true"></span>
          <h2 class="poster__head" id="poster-head">Wanted</h2>
          <p class="poster__for" id="poster-for"></p>
          <div class="poster__body">
            <div class="poster__photo"><canvas class="poster__portrait" id="portrait" width="320" height="400"></canvas></div>
            <div class="poster__facts">
              <p class="poster__name" id="poster-name"></p>
              <p class="poster__time" id="poster-time">
                <span class="poster__digits" id="poster-digits"></span>
                <span class="poster__unit" id="poster-unit">ms</span>
              </p>
              <p class="poster__note" id="poster-note"></p>
              <div class="poster__tally">
                <div class="tally-row"><span class="tally-row__name" data-name="0"></span><span class="holes holes--paper" data-holes="0"></span></div>
                <div class="tally-row"><span class="tally-row__name" data-name="1"></span><span class="holes holes--paper" data-holes="1"></span></div>
              </div>
            </div>
          </div>
          <span class="poster__stamp" id="poster-stamp"></span>
        </div>
        <div class="poster__actions">
          <button class="go go--small" id="next" type="button"><span class="go__label" id="next-label">Next round</span></button>
          <button class="ghost" id="home" type="button" hidden>New duel</button>
        </div>
      </div>
    </section>

    <div class="flash" id="flash" aria-hidden="true"></div>
    <p class="visually-hidden" id="announce" aria-live="polite"></p>
    <script src="./badge.js"></script>
  </body>
</html>
