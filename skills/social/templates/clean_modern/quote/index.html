<!doctype html><html><head><meta charset="utf-8">
<style>
@font-face { font-family:'Inter'; src:url('../../../fonts/Inter/Inter[opsz,wght].ttf'); font-weight:100 900; }
@font-face { font-family:'JetBrains Mono'; src:url('../../../fonts/JetBrainsMono/JetBrainsMono[wght].ttf'); font-weight:100 800; }
/* Clean modern: neutral ground, Inter set tight, JetBrains Mono for indices and labels,
   1px hairlines on a 6cqmin margin grid, product photos on soft rounded cards,
   one accent used for exactly one job per layout. */
:root, .canvas {
  --bg:#F4F4F1; --fg:#111215; --accent:#1F5BD8; --accent2:#E3E4DE;
  --ink:#111215; --paper:#FFFFFF;
  --font-display:'Inter'; --font-body:'Inter';
  /*{brand_css}*/
}
* { box-sizing:border-box; margin:0; padding:0; }
html, body { width:100%; height:100%; overflow:hidden; background:var(--bg); }
body { container-type:size; container-name:page; }
.canvas { position:relative; width:100%; height:100%; overflow:hidden; background:var(--bg); color:var(--fg);
  font-family:var(--font-body), 'Inter', system-ui, sans-serif; -webkit-font-smoothing:antialiased;
  font-feature-settings:"cv11" 1, "ss03" 1;
  --M:6cqmin; --R:2.2cqmin;
  --muted:color-mix(in srgb, var(--fg) 62%, var(--bg));
  --hair:color-mix(in srgb, var(--fg) 16%, var(--bg));
  --surface:color-mix(in srgb, var(--fg) 5%, var(--bg)); }
.canvas[data-tone=dark] { --surface:color-mix(in srgb, var(--fg) 8%, var(--bg)); --hair:color-mix(in srgb, var(--fg) 22%, var(--bg)); }
.display { font-family:var(--font-display), 'Inter', sans-serif; font-weight:620; font-variation-settings:"opsz" 32;
  letter-spacing:-0.038em; line-height:1.0; text-wrap:balance; color:var(--fg); padding:0.04em 0 0.14em; }
.body { font-size:2.7cqmin; line-height:1.45; color:var(--muted); letter-spacing:-0.006em; text-wrap:pretty; font-weight:450; }
.mono { font-family:'JetBrains Mono', monospace; font-weight:500; font-size:1.9cqmin; letter-spacing:0; color:var(--muted);
  font-variant-numeric:tabular-nums; }
.nw { white-space:nowrap; }
.box { min-height:0; min-width:0; overflow:hidden; }
[data-autofit] { overflow:hidden; }
.headline { flex-shrink:0; } /* never let flex squash the autofit target: its overflow would be hidden from the box measure */
.photo { position:absolute; overflow:hidden; background:var(--surface); border-radius:var(--R); }
.photo img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; object-position:var(--focal, 50% 50%); display:block; }
.hair { height:1px; background:var(--hair); flex:0 0 auto; }
/* CTA = printed words, never a button: mono caps led by a short rule. No fill, no outline, no pill. */
.cta { display:inline-flex; align-items:center; gap:1.8cqmin; font-family:'JetBrains Mono', monospace; font-weight:600; font-size:2.6cqmin;
  letter-spacing:0.07em; text-transform:uppercase; line-height:1.2; color:var(--fg); white-space:nowrap; flex:0 0 auto; }
.cta::before { content:""; flex:0 0 auto; width:5cqmin; height:max(2px, 0.22cqmin); background:currentColor; }
.cta.accent { color:var(--accent-ink); }
.cta:has(> [data-slot]:empty) { display:none; }
.dot { display:inline-block; width:1.3cqmin; height:1.3cqmin; border-radius:50%; background:var(--accent); flex:0 0 auto; }
/* swipe cue: a printed caption with a long hairline arrow, not a round next button */
.next { position:absolute; right:var(--M); bottom:var(--M); display:flex; align-items:center; gap:1.8cqmin; height:8.4cqmin;
  font-family:'JetBrains Mono', monospace; font-weight:500; font-size:2.1cqmin; letter-spacing:0.08em; text-transform:uppercase; color:var(--muted); }
.next .larr { width:10cqmin; height:2cqmin; overflow:visible; }
.sub:empty, .body:empty { display:none; }

.quote .page { position:absolute; inset:var(--M); display:flex; flex-direction:column; }
.quote .mark { flex:0 0 auto; font-weight:700; font-size:22cqmin; line-height:0.74; height:12cqmin; color:var(--accent-ink); letter-spacing:-0.05em; margin-left:-0.6cqmin; }
.quote .qbox { flex:1 1 auto; display:flex; flex-direction:column; justify-content:safe center; margin:3cqmin 0 4cqmin; }
.quote .q { font-size:7.4cqmin; font-weight:520; line-height:1.14; letter-spacing:-0.03em; }
.quote .foot { flex:0 0 auto; display:flex; align-items:center; gap:2.4cqmin; border-top:1px solid var(--hair); padding-top:3.2cqmin; }
.quote .av { width:7.6cqmin; height:7.6cqmin; border-radius:50%; background:var(--accent); color:var(--on-accent); display:flex;
  align-items:center; justify-content:center; font-weight:650; font-size:2.6cqmin; letter-spacing:0.01em; flex:0 0 auto; }
.quote .abox { flex:1 1 auto; min-width:0; }
.quote .author { font-size:2.8cqmin; font-weight:600; color:var(--fg); letter-spacing:-0.01em; white-space:nowrap; line-height:1.3; }
.quote .role { font-size:2.5cqmin; color:var(--muted); line-height:1.3; white-space:nowrap; }
.quote .foot:has(.author:empty) { visibility:hidden; }
@container page (aspect-ratio > 0.9) {
  .quote .q { font-size:6.5cqmin; }
  .quote .mark { font-size:18cqmin; height:9cqmin; }
}
@container page (aspect-ratio < 0.7) {
  .quote .page { top:calc(250px + 1cqh); bottom:calc(320px + 1cqh); }
  .quote .q { font-size:8.8cqmin; }
  .quote .author { font-size:3.8cqmin; } .quote .role { font-size:3.2cqmin; }
  .quote .av { width:9cqmin; height:9cqmin; font-size:3.1cqmin; }
}
</style></head><body>
<div class="canvas quote"><div class="page">
<div class="mark">&ldquo;</div>
<div class="qbox box"><div class="headline display q" data-slot="quote" data-safe-check data-autofit data-autofit-min="0.5">{{quote}}</div></div>
<div class="foot"><div class="av"></div><div class="abox box"><div class="author" data-slot="author" data-safe-check data-autofit data-autofit-min="0.7" data-nowidow>{{author}}</div></div></div>
</div>
<script>
(function(){ var a=document.querySelector('.quote .author'), av=document.querySelector('.quote .av'); if(!a||!av) return;
  var t=a.textContent.trim(); if(!t){ av.remove(); return; }
  var name=t.split(/[,\u2014\u2013|]| - /)[0].trim().replace(/^[^A-Za-z\u00C0-\u024F]+/,'');
  var w=name.split(/\s+/).filter(function(x){return /^[A-Za-z\u00C0-\u024F]/.test(x);});
  var ini=(w[0]||'').charAt(0)+(w.length>1?w[w.length-1].charAt(0):'');
  if(!ini) { av.remove(); return; } av.textContent=ini.toUpperCase();
})();
</script></div>
<script>
(function(){
  var cv=document.querySelector('.canvas'); if(!cv) return;
  var cs=getComputedStyle(cv);
  function g(k){return cs.getPropertyValue('--'+k).trim();}
  var p=document.createElement('i'); p.style.display='none'; document.body.appendChild(p);
  function rgb(c){p.style.color='';p.style.color=c;var m=getComputedStyle(p).color.match(/[\d.]+/g);return m?m.slice(0,3).map(Number):[128,128,128];}
  function L(c){var a=rgb(c).map(function(x){x/=255;return x<=0.03928?x/12.92:Math.pow((x+0.055)/1.055,2.4);});return .2126*a[0]+.7152*a[1]+.0722*a[2];}
  function C(a,b){var x=L(a),y=L(b);return (Math.max(x,y)+.05)/(Math.min(x,y)+.05);}
  var ink=g('ink'), paper=g('paper');
  function best(c){return C(c,ink)>=C(c,paper)?ink:paper;}
  var bg=g('bg'), fg=g('fg');
  if(C(fg,bg)<4.5){ fg=best(bg); cv.style.setProperty('--fg',fg); }
  ['accent','accent2'].forEach(function(k){ var c=g(k);
    cv.style.setProperty('--on-'+k,best(c));
    cv.style.setProperty('--'+k+'-ink', C(c,bg)>=3?c:fg); });
  cv.setAttribute('data-tone', L(bg)<0.18?'dark':'light');
  p.remove();
})();
</script>
<script>
document.querySelectorAll('[data-slot]').forEach(function(el){
  if (el.tagName==='IMG' || el.children.length || el.hasAttribute('data-nowidow')) return;
  var t=el.textContent; if(!t.trim()) { el.textContent=''; return; }
  var esc=function(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;');};
  var h=esc(t.trim()).replace(/(\S+-\S+)/g,'<span class="nw">$1</span>');
  var w=t.trim().split(/\s+/); if (w.length>3 && (w[w.length-1]+w[w.length-2]).length<=13) h=h.replace(/\s+(\S+)\s*$/,'&nbsp;$1');
  el.innerHTML=h;
});
</script>
</body></html>
