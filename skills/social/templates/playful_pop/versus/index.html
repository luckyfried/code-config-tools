<!doctype html><html><head><meta charset="utf-8">
<style>
@font-face { font-family:'Playfair Display'; src:url('../../../fonts/PlayfairDisplay/PlayfairDisplay[wght].ttf'); font-weight:400 900; }
@font-face { font-family:'Playfair Display'; src:url('../../../fonts/PlayfairDisplay/PlayfairDisplay-Italic[wght].ttf'); font-style:italic; font-weight:400 900; }
@font-face { font-family:'Bitter'; src:url('../../../fonts/Bitter/Bitter[wght].ttf'); font-weight:100 900; }
@font-face { font-family:'Archivo Black'; src:url('../../../fonts/ArchivoBlack/ArchivoBlack-Regular.ttf'); font-weight:400 900; }
@font-face { font-family:'Archivo'; src:url('../../../fonts/Archivo/Archivo[wdth,wght].ttf'); font-weight:100 900; }
@font-face { font-family:'Fraunces'; src:url('../../../fonts/Fraunces/Fraunces[SOFT,WONK,opsz,wght].ttf'); font-weight:100 900; }
@font-face { font-family:'Caveat'; src:url('../../../fonts/Caveat/Caveat[wght].ttf'); font-weight:400 700; }
@font-face { font-family:'Work Sans'; src:url('../../../fonts/WorkSans/WorkSans[wght].ttf'); font-weight:100 900; }
@font-face { font-family:'Space Grotesk'; src:url('../../../fonts/SpaceGrotesk/SpaceGrotesk[wght].ttf'); font-weight:300 700; }
@font-face { font-family:'Manrope'; src:url('../../../fonts/Manrope/Manrope[wght].ttf'); font-weight:200 800; }
@font-face { font-family:'Inter'; src:url('../../../fonts/Inter/Inter[opsz,wght].ttf'); font-weight:100 900; }
@font-face { font-family:'DM Serif Display'; src:url('../../../fonts/DMSerifDisplay/DMSerifDisplay-Regular.ttf'); font-weight:400; }
@font-face { font-family:'DM Serif Display'; src:url('../../../fonts/DMSerifDisplay/DMSerifDisplay-Italic.ttf'); font-style:italic; font-weight:400; }
@font-face { font-family:'JetBrains Mono'; src:url('../../../fonts/JetBrainsMono/JetBrainsMono[wght].ttf'); font-weight:100 800; }


*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#000}
body{container-type:size;container-name:page}
:root,.canvas{
  --bg:#FFCB3D; --fg:#1D1612; --accent:#FF5B3A; --accent2:#13A89A;
  --ink:#1D1612; --paper:#FFF8EC;
  --on-bg:var(--fg); --on-accent:var(--ink); --on-accent2:var(--ink); --hi:var(--accent);
  --font-display:'Fraunces'; --font-body:'Manrope';
  --pad:7cqw; --bw:.5cqw; --sh:1.4cqw; --edge:var(--ink); --r:2.6cqw;
  /*{brand_css}*/
}
.canvas{position:relative;width:100cqw;height:100cqh;overflow:hidden;background:var(--bg);color:var(--fg);
  font-family:var(--font-body),'Manrope',sans-serif;-webkit-font-smoothing:antialiased}
[data-autofit]{overflow:hidden}
.hl{font-family:var(--font-display),'Fraunces',serif;font-weight:800;font-variation-settings:"SOFT" 100,"WONK" 0,"opsz" 144;
  line-height:.95;letter-spacing:-.022em;text-wrap:balance;padding:.05em 0 .14em;overflow-wrap:normal}
.sub{font-family:var(--font-body),'Manrope',sans-serif;font-weight:600;font-size:3.35cqw;line-height:1.32;text-wrap:pretty}
.sub:empty,.cta:empty,.sticker-t:empty{display:none}
/* CTA = a strip of printed tape slapped on the page: torn zigzag ends, a tilt, no outline/shadow/arrow.
   Organic posts get no fake buttons, so nothing here may look tappable. */
.tape{display:inline-block;align-self:flex-start;background-color:var(--accent2);color:var(--on-accent2);
  background-image:linear-gradient(180deg,rgba(255,255,255,.22),rgba(255,255,255,0) 42%,rgba(0,0,0,.06));
  padding:.5em 1.15em .52em;font-family:var(--font-display),'Fraunces',serif;font-weight:800;font-variation-settings:"SOFT" 100,"opsz" 144;
  font-size:3.4cqw;line-height:1.1;letter-spacing:-.005em;white-space:nowrap;transform:rotate(-2.5deg);
  clip-path:polygon(0 0,100% 0,calc(100% - .3em) 14%,100% 28%,calc(100% - .3em) 42%,100% 57%,calc(100% - .3em) 71%,100% 85%,calc(100% - .3em) 100%,
    0 100%,.3em 86%,0 72%,.3em 57%,0 43%,.3em 29%,0 15%)}
.card{background:var(--paper);color:var(--ink);border:var(--bw) solid var(--edge);border-radius:var(--r);box-shadow:var(--sh) var(--sh) 0 var(--edge)}
.photo{position:relative;background:var(--paper);padding:1.5cqw;border:var(--bw) solid var(--edge);border-radius:var(--r);
  box-shadow:var(--sh) var(--sh) 0 var(--edge)}
.ph{position:relative;width:100%;height:100%;overflow:hidden;border-radius:calc(var(--r) - 1.2cqw);
  background:repeating-linear-gradient(45deg,color-mix(in srgb,var(--accent2) 30%,var(--paper)) 0 2cqw,var(--paper) 2cqw 4cqw)}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:var(--focal,center)}
.ph img[src=""]{display:none}
.burst{position:absolute;inset:0;width:100%;height:100%;overflow:visible;filter:drop-shadow(.8cqw .8cqw 0 var(--edge))}
.sticker{position:absolute;display:flex;align-items:center;justify-content:center;text-align:center;color:var(--on-accent);z-index:5}
.sticker-t{position:relative;font-family:var(--font-display),'Fraunces',serif;font-weight:900;font-variation-settings:"SOFT" 100,"opsz" 144;
  line-height:.9;letter-spacing:-.01em;padding:.06em 0 .1em}
.squiggle{display:block;width:30cqw;height:3.4cqw;overflow:visible}
.spark{position:absolute;overflow:visible;z-index:5}
.safe{padding:var(--pad)}
@container page (aspect-ratio < 0.7){ .safe{padding:14cqh var(--pad) 18.5cqh} }

/* ---- layout: versus ---- */

.versus{display:flex;flex-direction:column}
.versus .hlbox{flex:0 0 auto;max-height:20cqh;display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden;text-align:center}
.versus .hl{font-size:11.5cqw}
.versus .pair{position:relative;flex:1 1 0;min-height:0;display:grid;grid-template-columns:1fr 1fr;gap:5cqw;margin-top:5.4cqw;padding:1.5cqw 1cqw 2cqw}
.versus .photo{display:flex;flex-direction:column;padding:1.5cqw 1.5cqw 0;min-height:0}
.versus .a{transform:rotate(-3.5deg)}.versus .b{transform:rotate(3deg)}
.versus .photo .ph{flex:1 1 0;min-height:0;height:auto}
.versus .lab{flex:0 0 auto;font-family:var(--font-display),'Fraunces',serif;font-weight:800;font-variation-settings:"SOFT" 100,"opsz" 144;
  font-size:5.4cqw;line-height:1;padding:2.2cqw .5cqw 2.6cqw;text-align:center;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.versus .vs{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) rotate(-8deg);width:17cqw;height:17cqw;z-index:6;
  display:flex;align-items:center;justify-content:center;color:var(--on-accent)}
.versus .vs b{position:relative;font-family:'Fraunces',serif;font-weight:900;font-variation-settings:"SOFT" 100,"opsz" 144;font-size:6.6cqw;line-height:1;padding-bottom:.08em}
@container page (aspect-ratio > 0.9) and (aspect-ratio < 1.3){ .versus .hl{font-size:9.4cqw} .versus .hlbox{max-height:18cqh} .versus .pair{margin-top:4cqw;padding-left:7cqw;padding-right:7cqw} .versus .lab{font-size:4.4cqw} .versus .vs{width:14cqw;height:14cqw} .versus .vs b{font-size:5.4cqw} }
@container page (aspect-ratio >= 1.3){ .versus{display:grid;grid-template-columns:30% 1fr;column-gap:4cqw} .versus .hlbox{max-height:none;align-self:center;text-align:left} .versus .hl{font-size:6.4cqw} .versus .pair{margin:0} .versus .lab{font-size:3cqw} .versus .vs{width:10cqw;height:10cqw} .versus .vs b{font-size:3.8cqw} }
@container page (aspect-ratio < 0.7){
  .versus .pair{grid-template-columns:1fr;grid-template-rows:1fr 1fr;gap:6cqw;padding:1cqw 6cqw 2cqw}
  .versus .hlbox{max-height:17cqh} .versus .hl{font-size:13cqw}
  .versus .vs{left:auto;right:-1cqw;transform:translate(0,-50%) rotate(-8deg);width:20cqw;height:20cqw} .versus .vs b{font-size:7.6cqw}
  .versus .lab{font-size:6cqw}
}

</style></head><body>
<div class="canvas versus safe">
  <div class="hlbox"><div class="hl" data-slot="headline" data-autofit data-autofit-min="0.4" data-safe-check>{{headline}}</div></div>
  <div class="pair">
    <div class="photo a"><div class="ph"><img data-slot="image_a" src="{{image_a}}" alt=""></div><div class="lab" data-slot="label_a" data-safe-check>{{label_a}}</div></div>
    <div class="photo b"><div class="ph"><img data-slot="image_b" src="{{image_b}}" alt=""></div><div class="lab" data-slot="label_b" data-safe-check>{{label_b}}</div></div>
    <div class="vs"><svg class="burst" viewBox="0 0 200 200" aria-hidden="true"><polygon points="100.0,4.0 117.1,25.1 141.7,13.5 147.9,40.0 175.1,40.1 169.2,66.7 193.6,78.6 176.8,100.0 193.6,121.4 169.2,133.3 175.1,159.9 147.9,160.0 141.7,186.5 117.1,174.9 100.0,196.0 82.9,174.9 58.3,186.5 52.1,160.0 24.9,159.9 30.8,133.3 6.4,121.4 23.2,100.0 6.4,78.6 30.8,66.7 24.9,40.1 52.1,40.0 58.3,13.5 82.9,25.1" style="fill:var(--sticker-fill,var(--accent));stroke:var(--edge);stroke-width:4.5;stroke-linejoin:round"/></svg><b>vs</b></div>
  </div>
</div>
<script>
(function(){
  var cv=document.querySelector('.canvas'); if(!cv) return;
  var probe=document.createElement('i'); probe.style.display='none'; document.body.appendChild(probe);
  function g(k){return getComputedStyle(cv).getPropertyValue('--'+k).trim();}
  function rgb(c){probe.style.color='';probe.style.color=c;var m=getComputedStyle(probe).color.match(/[\d.]+/g);return m?m.slice(0,3).map(Number):[128,128,128];}
  function L(c){var a=rgb(c).map(function(x){x=x/255;return x<=0.03928?x/12.92:Math.pow((x+0.055)/1.055,2.4);});return .2126*a[0]+.7152*a[1]+.0722*a[2];}
  function C(a,b){var x=L(a),y=L(b);return (Math.max(x,y)+.05)/(Math.min(x,y)+.05);}
  function best(c){return C(c,g('ink'))>=C(c,g('paper'))?g('ink'):g('paper');}
  var bg=g('bg');
  if(C(g('fg'),bg)<3){cv.style.setProperty('--fg',best(bg));}
  ['bg','accent','accent2'].forEach(function(k){cv.style.setProperty('--on-'+k,best(g(k)));});
  var hi=C(g('accent'),bg)>=2.3?g('accent'):(C(g('accent2'),bg)>=2.3?g('accent2'):g('fg'));
  cv.style.setProperty('--hi',hi);
  var a2=g('accent2'); cv.style.setProperty('--hi2',C(g('accent'),a2)>=2.3?g('accent'):best(a2));
  probe.remove();
})();
</script>
</body></html>
